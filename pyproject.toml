[project]
name = "auth_service"
version = "0.1.0"
description = "Authorization-Microservice"
authors = [
    {name = "Sophia", email = "ms.shb2004@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.128.0)",
    "sqlalchemy[asyncio] (>=2.0.45,<3.0.0)",
    "pydantic-settings (==2.12.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "alembic (==1.17.2)",
    "asyncpg (==0.31.0)",
    "uvicorn[standart] (>=0.40.0,<0.41.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-json-logger (==4.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "orjson (>=3.11.5,<4.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "dishka (>=1.7.2,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "auth_service", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
