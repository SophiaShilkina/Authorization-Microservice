[project]
name = "ct-backend"
version = "0.1.0"
description = "Бэкенд для веб-приложения CaringTails"
authors = [
    {name = "Sophia", email = "ms.shb2004@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.124.4)",
    "sqlalchemy (==2.0.45)",
    "pydantic-settings (==2.12.0)",
    "pydantic (==2.12.5)",
    "alembic (==1.17.2)",
    "asyncpg (==0.31.0)",
    "uvicorn (==0.38.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-json-logger (==4.0.0)"
]

[tool.poetry]
packages = [{include = "ct_backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
